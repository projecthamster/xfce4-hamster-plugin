# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/xfce4-hamster-plugin-ci:debian-stable

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a set of commands using the runners shell
      - name: Build
        run: |
          set -e
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build "$GITHUB_WORKSPACE/build" --parallel

      # The image marker decides strictness: an image built before the live
      # panel tests lacks it, so this warns and skips them instead of failing
      # configuration; the published image carries it and runs them strictly.
      - name: Test
        run: |
          set -e
          strict=ON
          if [ ! -f /usr/share/xfce4-hamster-plugin-ci/live-panel-tools ]; then
            strict=OFF
            echo "::warning::This CI image predates the live panel tests; configuring without HAMSTER_REQUIRE_RUNTIME_TESTS so the panel tests skip instead of failing. Publish the new image and re-run for 5/5."
          fi
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DHAMSTER_REQUIRE_RUNTIME_TESTS="$strict"
          cmake --build "$GITHUB_WORKSPACE/build" --parallel
          ctest --test-dir "$GITHUB_WORKSPACE/build" --output-on-failure
